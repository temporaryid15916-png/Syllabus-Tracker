<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Syllabus Tracker</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#16824e">

<style>
:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#18202a;
  --muted:#667085;
  --border:#e5e7eb;
  --soft:#fafbfc;
  --done:#ecfdf3;
  --done-border:#b7ebce;
  --green:#16824e;
  --green2:#20a464;
  --button-bg:#e8f7ef;
  --button-text:#147a48;
}

body.dark{
  --bg:#101418;
  --card:#182027;
  --text:#edf2f7;
  --muted:#aab4c0;
  --border:#303a44;
  --soft:#202a33;
  --done:#123b29;
  --done-border:#246b4a;
  --green:#39b878;
  --green2:#35c47c;
  --button-bg:#173c2b;
  --button-text:#65d39a;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background .2s,color .2s;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

h1{
  margin:0;
  font-size:28px;
}

.sub{
  margin-top:6px;
  color:var(--muted);
  font-size:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.book-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:10px;
}

.chapter{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--soft);
  transition:.2s;
}

.chapter.done{
  background:var(--done);
  border-color:var(--done-border);
}

.chapterName{
  flex:1;
  min-width:0;
  border:1px solid var(--border);
  border-radius:7px;
  padding:8px 9px;
  background:var(--card);
  color:var(--text);
  outline:none;
}

.chapterName:focus{
  border-color:var(--green);
}

.select{
  border:0;
  border-radius:7px;
  padding:8px 10px;
  background:var(--button-bg);
  color:var(--button-text);
  cursor:pointer;
  font-weight:bold;
}

.selected{
  border:0;
  border-radius:7px;
  padding:8px 10px;
  background:var(--green);
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.reset{
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px 13px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  font-weight:bold;
}

.reset:hover{
  background:var(--soft);
}

.theme-btn{
  white-space:nowrap;
}

/* Progress */
.progress-wrap{
  margin-top:10px;
  margin-bottom:18px;
}

.progress-text{
  color:var(--muted);
  font-size:14px;
  margin-bottom:6px;
}

.progress{
  width:100%;
  height:8px;
  background:var(--border);
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:var(--green);
  transition:.3s;
}

/* Footer */
.footer{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:25px 0;
}

/* Copyright */
.copyright{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:-10px;
  margin-bottom:12px;
  opacity:.8;
}

@media(max-width:600px){
  .container{
    padding:12px;
  }

  .header{
    align-items:flex-start;
  }

  h1{
    font-size:23px;
  }

  .chapter{
    flex-direction:row;
  }

  .chapterName{
    min-width:0;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div>
      <h1>📚 Syllabus Tracker</h1>

      <div class="sub">
        Select a chapter when you complete it. Your progress is saved automatically.
      </div>
    </div>

    <button
      id="themeBtn"
      class="reset theme-btn"
      onclick="toggleDarkMode()">
      🌙 Dark
    </button>
  </div>

  <div id="app"></div>

  <div class="footer">

    <button
      id="saveBtn"
      class="reset"
      onclick="saveNow()">
      💾 Save
    </button>

    <button
      class="reset"
      onclick="resetAll()">
      Reset All
    </button>

  </div>

  <div class="copyright">
    ©turabi_alam
  </div>

</div>


<script>

/* =========================
   BOOKS
========================= */

const books = {

  ],

  "Physics 2nd Paper": [

    "স্থির তড়িৎ",
    "চল তড়িৎ",
    "তড়িৎ প্রবাহের চৌম্বক ক্রিয়া",
    "তড়িৎ চৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ",
    "জ্যামিতিক আলোকবিজ্ঞান",
    "ভৌত আলোকবিজ্ঞান",
    "আধুনিক পদার্থবিজ্ঞানের সূচনা",
    "পরমাণুর মডেল ও নিউক্লিয়ার পদার্থবিজ্ঞান",
    "সেমিকন্ডাক্টর ও ইলেকট্রনিক্স",

  ],

    "গুণগত রসায়ন",
    "মৌলের পর্যায়বৃত্ত ধর্ম ও রাসায়নিক বন্ধন",
    "রাসায়নিক পরিবর্তন",

  ],

  "Chemistry 2nd Paper": [
    "পরিবেশ রসায়ন",

    "তড়িৎ রসায়ন",

  ],

  "Higher Math 1st Paper": [

    "বৃত্ত",
    "বিন্যাস ও সমাবেশ",

    "ফাংশন ও ফাংশনের লেখচিত্র",

  ],

  "Higher Math 2nd Paper": [

    "কনিক",
    "বিপরীত ত্রিকোণমিতিক ফাংশন ও ত্রিকোণমিতিক সমীকরণ",
    "স্থিতিবিদ্যা",

    "বিস্তার পরিমাপ ও সম্ভাবনা"
  ],

  "Botany": [
    "কোষ ও এর গঠন",
    "কোষ বিভাজন",
    "কোষ রসায়ন",
    "অণুজীব",
    "শৈবাল ও ছত্রাক",
    "ব্রায়োফাইটা ও টেরিডোফাইটা",
    "নগ্নবীজী ও আবৃতবীজী উদ্ভিদ",
    "টিস্যু ও টিস্যুতন্ত্র",
    "উদ্ভিদ শারীরতত্ত্ব",
    "উদ্ভিদের প্রজনন",
    "জীবপ্রযুক্তি",
    "জীবের পরিবেশ, বিস্তার ও সংরক্ষণ"
  ],

  "Zoology": [
    "প্রাণীর পরিচিতি",
    "প্রাণীর শ্রেণিবিন্যাস",
    "পরিপাক ও শোষণ",
    "রক্ত ও সঞ্চালন",
    "শ্বাসক্রিয়া",
    "বর্জ্য ও নিষ্কাশন",
    "চলন ও অঙ্গচালনা",
    "সমন্বয় ও নিয়ন্ত্রণ",
    "মানব জীবনের ধারাবাহিকতা",
    "মানবদেহের প্রতিরক্ষা",
    "জিনতত্ত্ব ও বিবর্তন",
    "প্রাণীর আচরণ"
  ]

};


/* =========================
   STORAGE
========================= */

let saved = JSON.parse(
  localStorage.getItem("syllabusTracker") || "{}"
);


/* =========================
   REMOVE OLD GENERIC NAMES
========================= */

Object.keys(saved).forEach(k => {

  if(
    k.startsWith("name__") &&
    /^Chapter\s+\d+$/i.test(saved[k])
  ){

    delete saved[k];

  }

});

localStorage.setItem(
  "syllabusTracker",
  JSON.stringify(saved)
);


/* =========================
   KEY
========================= */

function key(book, chapter){

  return book + "__" + chapter;

}


/* =========================
   RENDER
========================= */

function render(){

  const app =
    document.getElementById("app");

  app.innerHTML = "";


  /* =========================
     CALCULATE TOTAL FIRST
     FOR OVERALL PROGRESS
  ========================= */

  let total = 0;
  let completed = 0;

  Object.entries(books).forEach(
    ([book, count]) => {

      total += count;

      for(let c = 1; c <= count; c++){

        if(saved[key(book, c)]){
          completed++;
        }

      }

    }
  );


  /* =========================
     OVERALL PROGRESS
     SHOW AT TOP
  ========================= */

  const overall =
    document.createElement("div");

  overall.className = "card";

  const percent =
    total === 0
      ? 0
      : Math.round(
          (completed / total) * 100
        );

  overall.innerHTML = `

    <strong>Overall Progress</strong>

    <div class="progress-wrap">

      <div class="progress-text">
        ${completed} / ${total} completed — ${percent}%
      </div>

      <div class="progress">

        <div
          class="progress-bar"
          style="width:${percent}%">
        </div>

      </div>

    </div>

  `;

  app.appendChild(overall);


  /* =========================
     SUBJECTS
  ========================= */

  Object.entries(books).forEach(
    ([book, count]) => {

      const card =
        document.createElement("div");

      card.className = "card";


      /* Subject title */

      const title =
        document.createElement("div");

      title.className =
        "book-title";

      title.textContent = book;

      card.appendChild(title);


      /* =========================
         SUBJECT PROGRESS
         BEFORE CHAPTERS
      ========================= */

      const bookCompleted =
        Array.from(
          {length: count},
          (_, i) =>
            !!saved[
              key(book, i + 1)
            ]
        ).filter(Boolean).length;


      const progressWrap =
        document.createElement("div");

      progressWrap.className =
        "progress-wrap";


      const progressText =
        document.createElement("div");

      progressText.className =
        "progress-text";

      progressText.textContent =
        `${bookCompleted} / ${count} completed`;


      const progress =
        document.createElement("div");

      progress.className =
        "progress";


      const progressBar =
        document.createElement("div");

      progressBar.className =
        "progress-bar";

      progressBar.style.width =
        `${(bookCompleted / count) * 100}%`;


      progress.appendChild(
        progressBar
      );

      progressWrap.appendChild(
        progressText
      );

      progressWrap.appendChild(
        progress
      );


      /* Progress comes BEFORE chapters */

      card.appendChild(
        progressWrap
      );


      /* =========================
         CHAPTER GRID
      ========================= */

      const grid =
        document.createElement("div");

      grid.className = "grid";


      for(
        let c = 1;
        c <= count;
        c++
      ){

        const isDone =
          !!saved[key(book, c)];


        const row =
          document.createElement("div");

        row.className =
          "chapter" +
          (isDone ? " done" : "");


        const nameKey =
          "name__" +
          key(book, c);


        let savedName =
          saved[nameKey];


        if(
          !savedName ||
          /^Chapter\s+\d+$/i.test(savedName)
        ){

          savedName =
            permanentChapterNames[book]?.[
              c - 1
            ] ||
            `Chapter ${c}`;

        }


        row.innerHTML = `

          <input
            class="chapterName"
            value="${String(savedName)
              .replace(/&/g,"&amp;")
              .replace(/"/g,"&quot;")
              .replace(/</g,"&lt;")
              .replace(/>/g,"&gt;")}"
            aria-label="Chapter ${c} name"
          >

          <button class="${
            isDone
              ? "selected"
              : "select"
          }">

            ${
              isDone
                ? "Selected"
                : "Select"
            }

          </button>

        `;


        /* =========================
           SAVE CHAPTER NAME
        ========================= */

        const input =
          row.querySelector(
            ".chapterName"
          );


        input.addEventListener(
          "change",
          () => {

            const value =
              input.value.trim();


            if(value){

              saved[nameKey] =
                value;

            }else{

              delete saved[nameKey];

            }


            localStorage.setItem(
              "syllabusTracker",
              JSON.stringify(saved)
            );

          }
        );


        input.addEventListener(
          "keydown",
          (e) => {

            if(e.key === "Enter"){

              input.blur();

            }

          }
        );


        /* =========================
           SELECT / UNSELECT
        ========================= */

        row.querySelector("button").onclick =
          () => {

            saved[key(book, c)] =
              !saved[key(book, c)];


            localStorage.setItem(
              "syllabusTracker",
              JSON.stringify(saved)
            );


            render();

          };


        grid.appendChild(row);

      }


      /* Chapters after progress */

      card.appendChild(grid);

      app.appendChild(card);

    }
  );

}


/* =========================
   SAVE
========================= */

function saveNow(){

  localStorage.setItem(
    "syllabusTracker",
    JSON.stringify(saved)
  );


  const btn =
    document.getElementById(
      "saveBtn"
    );


  if(btn){

    const oldText =
      btn.textContent;


    btn.textContent =
      "✅ Saved";


    setTimeout(
      () => {

        btn.textContent =
          oldText;

      },
      1200
    );

  }

}


/* =========================
   RESET
========================= */

function resetAll(){

  const ok =
    confirm(
      "Are you sure you want to reset all progress?"
    );


  if(!ok){
    return;
  }


  /*
    শুধু progress reset হবে।
    Chapter names থাকবে।
  */

  Object.keys(saved).forEach(k => {

    if(!k.startsWith("name__")){

      delete saved[k];

    }

  });


  localStorage.setItem(
    "syllabusTracker",
    JSON.stringify(saved)
  );


  render();

}


/* =========================
   DARK MODE
========================= */

function applyTheme(){

  const dark =
    localStorage.getItem(
      "syllabusTheme"
    ) === "dark";


  document.body.classList.toggle(
    "dark",
    dark
  );


  const btn =
    document.getElementById(
      "themeBtn"
    );


  if(btn){

    btn.textContent =
      dark
        ? "☀️ Light"
        : "🌙 Dark";

  }

}


function toggleDarkMode(){

  const dark =
    !document.body.classList.contains(
      "dark"
    );


  document.body.classList.toggle(
    "dark",
    dark
  );


  localStorage.setItem(
    "syllabusTheme",
    dark
      ? "dark"
      : "light"
  );


  applyTheme();

}


/* =========================
   START
========================= */

applyTheme();

render();


/* =========================
   AUTO SAVE
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    localStorage.setItem(
      "syllabusTracker",
      JSON.stringify(saved)
    );

  }
);

</script>


<!-- =========================
     SERVICE WORKER
========================= -->

<script>

if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register("./sw.js")
        .catch(() => {});

    }
  );

}

</script>

</body>
</html>
