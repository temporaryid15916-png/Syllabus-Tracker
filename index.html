<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Syllabus Tracker</title>

<link rel="manifest" href="./manifest.webmanifest">

<meta name="theme-color" content="#16824e">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{

  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#18202a;
  --muted:#667085;

  --border:#e5e7eb;
  --soft:#fafbfc;

  --green:#16824e;
  --green2:#20a464;

  --button-bg:#e8f7ef;
  --button-text:#147a48;

  --done:#ecfdf3;
  --done-border:#b7ebce;

  --progress-bg:#e7eaf0;

  --warning:#f59e0b;
  --warning-bg:#fff7e6;

  --blue:#2563eb;
  --blue-bg:#eff6ff;

  --danger:#dc2626;
  --danger-bg:#fef2f2;

  --shadow:0 4px 15px rgba(0,0,0,.05);

}


/* =========================================================
   DARK MODE
========================================================= */

body.dark{

  --bg:#101418;
  --card:#182027;
  --text:#edf2f7;
  --muted:#aab4c0;

  --border:#303a44;
  --soft:#202a33;

  --green:#39b878;
  --green2:#35c47c;

  --button-bg:#173c2b;
  --button-text:#65d39a;

  --done:#123b29;
  --done-border:#246b4a;

  --progress-bg:#303a44;

  --warning:#fbbf24;
  --warning-bg:#3a2b0b;

  --blue:#60a5fa;
  --blue-bg:#172554;

  --danger:#f87171;
  --danger-bg:#3a1616;

  --shadow:0 4px 15px rgba(0,0,0,.2);

}


/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  font-family:
    Arial,
    "Noto Sans Bengali",
    sans-serif;

  background:var(--bg);
  color:var(--text);

  transition:
    background .2s,
    color .2s;

  padding-bottom:30px;

}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   CONTAINER
========================================================= */

.container{

  max-width:1100px;

  margin:auto;

  padding:20px;

}


/* =========================================================
   HEADER
========================================================= */

.header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:20px;

}

.header-left{
  min-width:0;
}

h1{

  margin:0;

  font-size:28px;

  letter-spacing:-.4px;

}

.sub{

  margin-top:6px;

  color:var(--muted);

  font-size:14px;

}


/* =========================================================
   BUTTONS
========================================================= */

.btn{

  border:1px solid var(--border);

  border-radius:9px;

  padding:9px 13px;

  background:var(--card);

  color:var(--text);

  cursor:pointer;

  font-weight:bold;

  transition:.2s;

}

.btn:hover{

  background:var(--soft);

  transform:translateY(-1px);

}

.btn:active{

  transform:scale(.97);

}

.theme-btn{
  white-space:nowrap;
}


/* =========================================================
   CARD
========================================================= */

.card{

  background:var(--card);

  border:1px solid var(--border);

  border-radius:16px;

  padding:18px;

  margin-bottom:18px;

  box-shadow:var(--shadow);

}


/* =========================================================
   DASHBOARD HERO
========================================================= */

.dashboard{

  display:grid;

  grid-template-columns:
    minmax(0,1.3fr)
    minmax(280px,.7fr);

  gap:15px;

  margin-bottom:18px;

}

.hero-card{

  background:
    linear-gradient(
      135deg,
      var(--green),
      var(--green2)
    );

  color:white;

  border-radius:18px;

  padding:22px;

  box-shadow:
    0 8px 25px rgba(22,130,78,.2);

}

.hero-small{

  opacity:.9;

  font-size:14px;

  margin-bottom:7px;

}

.hero-number{

  font-size:38px;

  font-weight:800;

  margin-bottom:4px;

}

.hero-sub{

  font-size:14px;

  opacity:.9;

}

.hero-progress{

  height:10px;

  background:rgba(255,255,255,.25);

  border-radius:20px;

  overflow:hidden;

  margin-top:18px;

}

.hero-progress-bar{

  height:100%;

  background:white;

  border-radius:20px;

  transition:.4s;

}


/* =========================================================
   QUICK STATS
========================================================= */

.quick-stats{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;

}

.quick-stat{

  background:var(--card);

  border:1px solid var(--border);

  border-radius:14px;

  padding:15px;

  box-shadow:var(--shadow);

}

.quick-label{

  color:var(--muted);

  font-size:12px;

  margin-bottom:5px;

}

.quick-value{

  font-size:22px;

  font-weight:bold;

}


/* =========================================================
   CONTINUE STUDYING
========================================================= */

.continue-card{

  border-left:
    4px solid var(--green);

}

.continue-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  margin-bottom:10px;

}

.section-title{

  font-size:18px;

  font-weight:bold;

}

.continue-book{

  color:var(--muted);

  font-size:13px;

  margin-bottom:5px;

}

.continue-chapter{

  font-size:17px;

  font-weight:bold;

  margin-bottom:10px;

}

.continue-meta{

  color:var(--muted);

  font-size:13px;

}


/* =========================================================
   SEARCH / FILTER
========================================================= */

.tools-card{

  position:sticky;

  top:10px;

  z-index:20;

}

.tools-row{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

}

.search-box{

  flex:1;

  min-width:220px;

  border:1px solid var(--border);

  border-radius:10px;

  padding:11px 13px;

  background:var(--soft);

  color:var(--text);

  outline:none;

}

.search-box:focus{

  border-color:var(--green);

  box-shadow:
    0 0 0 3px
    rgba(22,130,78,.1);

}

.filter-select{

  border:1px solid var(--border);

  border-radius:10px;

  padding:11px 13px;

  background:var(--soft);

  color:var(--text);

  outline:none;

  cursor:pointer;

}


/* =========================================================
   FILTER CHIPS
========================================================= */

.filter-chips{

  display:flex;

  gap:7px;

  flex-wrap:wrap;

  margin-top:10px;

}

.chip{

  border:1px solid var(--border);

  border-radius:30px;

  padding:7px 11px;

  background:var(--card);

  color:var(--muted);

  cursor:pointer;

  font-size:12px;

  font-weight:bold;

}

.chip.active{

  background:var(--green);

  color:white;

  border-color:var(--green);

}


/* =========================================================
   SUBJECT CARD
========================================================= */

.subject-card{

  overflow:hidden;

}

.subject-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:12px;

  cursor:pointer;

}

.subject-left{

  flex:1;

  min-width:0;

}

.book-title{

  font-size:20px;

  font-weight:bold;

  margin-bottom:7px;

}

.subject-meta{

  color:var(--muted);

  font-size:13px;

}

.subject-actions{

  display:flex;

  align-items:center;

  gap:8px;

}

.chevron{

  font-size:18px;

  color:var(--muted);

  transition:.2s;

}

.subject-card.collapsed .chevron{

  transform:rotate(-90deg);

}

.subject-progress{

  margin-top:12px;

}

.subject-progress-line{

  height:7px;

  background:var(--progress-bg);

  border-radius:20px;

  overflow:hidden;

}

.subject-progress-bar{

  height:100%;

  background:var(--green);

  border-radius:20px;

  transition:.35s;

}


/* =========================================================
   CHAPTER GRID
========================================================= */

.chapter-container{

  margin-top:15px;

}

.subject-card.collapsed
.chapter-container{

  display:none;

}

.grid{

  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

  gap:10px;

}


/* =========================================================
   CHAPTER
========================================================= */

.chapter{

  display:flex;

  align-items:center;

  gap:8px;

  padding:10px;

  border:1px solid var(--border);

  border-radius:11px;

  background:var(--soft);

  transition:.2s;

}

.chapter:hover{

  transform:translateY(-1px);

  box-shadow:
    0 3px 10px rgba(0,0,0,.04);

}

.chapter.done{

  background:var(--done);

  border-color:var(--done-border);

}

.chapter.in-progress{

  background:var(--warning-bg);

  border-color:rgba(245,158,11,.35);

}


/* =========================================================
   FIXED CHAPTER NAME
========================================================= */

.chapterName{

  flex:1;

  min-width:0;

  padding:7px 3px;

  color:var(--text);

  font-weight:500;

  line-height:1.4;

  word-break:break-word;

}


/* =========================================================
   STATUS BUTTON
========================================================= */

.status-btn{

  border:0;

  border-radius:8px;

  padding:8px 9px;

  cursor:pointer;

  font-size:12px;

  font-weight:bold;

  white-space:nowrap;

  min-width:88px;

}

.status-not-started{

  background:var(--button-bg);

  color:var(--button-text);

}

.status-progress{

  background:#fef3c7;

  color:#92400e;

}

body.dark
.status-progress{

  background:#3a2b0b;

  color:#fbbf24;

}

.status-completed{

  background:var(--green);

  color:white;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap{

  margin-top:10px;

  margin-bottom:18px;

}

.progress-text{

  color:var(--muted);

  font-size:14px;

  margin-bottom:6px;

}

.progress{

  width:100%;

  height:8px;

  background:var(--progress-bg);

  border-radius:20px;

  overflow:hidden;

}

.progress-bar{

  height:100%;

  width:0%;

  background:var(--green);

  transition:.3s;

}


/* =========================================================
   NOTES
========================================================= */

.notes-box{

  margin-top:14px;

  border-top:1px solid var(--border);

  padding-top:14px;

}

.notes-title{

  font-size:14px;

  font-weight:bold;

  margin-bottom:7px;

}

.notes-input{

  width:100%;

  min-height:80px;

  resize:vertical;

  border:1px solid var(--border);

  border-radius:9px;

  padding:10px;

  background:var(--soft);

  color:var(--text);

  outline:none;

}

.notes-input:focus{

  border-color:var(--green);

}

.notes-save{

  margin-top:7px;

}


/* =========================================================
   TIMER
========================================================= */

.timer-card{

  text-align:center;

}

.timer-title{

  font-size:18px;

  font-weight:bold;

}

.timer-display{

  font-size:42px;

  font-weight:800;

  margin:12px 0;

  letter-spacing:2px;

}

.timer-controls{

  display:flex;

  justify-content:center;

  gap:8px;

  flex-wrap:wrap;

}

.timer-input{

  width:90px;

  border:1px solid var(--border);

  border-radius:8px;

  padding:9px;

  background:var(--soft);

  color:var(--text);

  text-align:center;

}


/* =========================================================
   BACKUP AREA
========================================================= */

.backup-grid{

  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(210px,1fr));

  gap:10px;

}

.backup-btn{

  width:100%;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

  display:flex;

  justify-content:center;

  gap:10px;

  flex-wrap:wrap;

  margin:25px 0;

}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty{

  text-align:center;

  padding:35px 15px;

  color:var(--muted);

}

.empty-icon{

  font-size:35px;

  margin-bottom:8px;

}


/* =========================================================
   COPYRIGHT
========================================================= */

.copyright{

  text-align:center;

  color:var(--muted);

  font-size:11px;

  margin-top:-10px;

  margin-bottom:12px;

  opacity:.8;

}


/* =========================================================
   MOBILE BOTTOM NAV
========================================================= */

.mobile-nav{

  display:none;

}

.mobile-nav button{

  flex:1;

  border:0;

  background:transparent;

  color:var(--muted);

  padding:8px 4px;

  cursor:pointer;

  font-size:11px;

}

.mobile-nav button span{

  display:block;

  font-size:18px;

  margin-bottom:2px;

}

.mobile-nav button.active{

  color:var(--green);

}


/* =========================================================
   TOAST
========================================================= */

.toast{

  position:fixed;

  left:50%;

  bottom:25px;

  transform:
    translate(-50%,20px);

  background:#18202a;

  color:white;

  padding:10px 16px;

  border-radius:30px;

  font-size:13px;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  z-index:100;

}

.toast.show{

  opacity:1;

  transform:
    translate(-50%,0);

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:750px){

  .container{

    padding:12px;

  }

  .dashboard{

    grid-template-columns:1fr;

  }

  .header{

    align-items:flex-start;

  }

  h1{

    font-size:23px;

  }

  .book-title{

    font-size:18px;

  }

  .chapter{

    align-items:center;

  }

  .status-btn{

    min-width:82px;

    padding:8px 7px;

  }

  .tools-card{

    top:5px;

  }

  .mobile-nav{

    position:fixed;

    display:flex;

    left:0;

    right:0;

    bottom:0;

    z-index:50;

    background:var(--card);

    border-top:1px solid var(--border);

    box-shadow:0 -4px 15px rgba(0,0,0,.08);

    padding:
      5px
      5px
      calc(5px + env(safe-area-inset-bottom));

  }

  body{

    padding-bottom:75px;

  }

  .footer{

    margin-bottom:15px;

  }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media(max-width:430px){

  .chapter{

    flex-wrap:wrap;

  }

  .chapterName{

    width:100%;

    flex-basis:
      calc(100% - 0px);

  }

  .status-btn{

    margin-left:auto;

  }

  .hero-number{

    font-size:32px;

  }

}

</style>

</head>


<body>


<div class="container">


<!-- =======================================================
     HEADER
======================================================= -->

<div class="header">

  <div class="header-left">

    <h1>📚 Syllabus Tracker</h1>

    <div class="sub">
      Track your study progress chapter by chapter.
    </div>

  </div>


  <button
    id="themeBtn"
    class="btn theme-btn"
    onclick="toggleDarkMode()">

    🌙 Dark

  </button>

</div>


<!-- =======================================================
     DASHBOARD
======================================================= -->

<div
  id="dashboard"
  class="dashboard">
</div>


<!-- =======================================================
     CONTINUE STUDYING
======================================================= -->

<div
  id="continueCard"
  class="card continue-card">

</div>


<!-- =======================================================
     SEARCH / FILTER
======================================================= -->

<div
  id="subjectsSection"
  class="card tools-card">

  <div class="section-title">
    📚 Subjects & Chapters
  </div>


  <div class="tools-row">

    <input
      id="searchInput"
      class="search-box"
      type="search"
      placeholder="🔎 Search chapter..."
      oninput="render()"
    >


    <select
      id="subjectFilter"
      class="filter-select"
      onchange="render()">

      <option value="all">
        All Subjects
      </option>

      <option value="Physics">
        Physics
      </option>

      <option value="Chemistry">
        Chemistry
      </option>

      <option value="Higher Math">
        Higher Math
      </option>

      <option value="Biology">
        Biology
      </option>

    </select>


    <select
      id="statusFilter"
      class="filter-select"
      onchange="render()">

      <option value="all">
        All Chapters
      </option>

      <option value="not-started">
        Not Started
      </option>

      <option value="in-progress">
        In Progress
      </option>

      <option value="completed">
        Completed
      </option>

    </select>

  </div>


  <div class="filter-chips">

    <button
      class="chip active"
      onclick="setQuickFilter('all',this)">
      All
    </button>

    <button
      class="chip"
      onclick="setQuickFilter('completed',this)">
      ✅ Completed
    </button>

    <button
      class="chip"
      onclick="setQuickFilter('in-progress',this)">
      🟡 In Progress
    </button>

    <button
      class="chip"
      onclick="setQuickFilter('not-started',this)">
      ⚪ Not Started
    </button>

  </div>

</div>


<!-- =======================================================
     APP
======================================================= -->

<div id="app"></div>


<!-- =======================================================
     STUDY TIMER
======================================================= -->

<div
  id="timerSection"
  class="card timer-card">

  <div class="timer-title">
    ⏱️ Study Timer
  </div>

  <div
    id="timerDisplay"
    class="timer-display">
    25:00
  </div>


  <div class="timer-controls">

    <input
      id="timerMinutes"
      class="timer-input"
      type="number"
      min="1"
      max="180"
      value="25"
    >

    <button
      class="btn"
      onclick="startTimer()">
      ▶ Start
    </button>

    <button
      class="btn"
      onclick="pauseTimer()">
      ⏸ Pause
    </button>

    <button
      class="btn"
      onclick="resetTimer()">
      ↻ Reset
    </button>

  </div>

</div>


<!-- =======================================================
     BACKUP
======================================================= -->

<div
  id="backupSection"
  class="card">

  <div class="section-title">
    💾 Backup & Restore
  </div>

  <div
    style="
      color:var(--muted);
      font-size:13px;
      margin:7px 0 13px;
    ">

    Keep a backup of your progress so it can be restored
    if browser data is cleared.

  </div>


  <div class="backup-grid">

    <button
      class="btn backup-btn"
      onclick="downloadBackup()">

      📥 Backup Progress

    </button>


    <button
      class="btn backup-btn"
      onclick="document.getElementById('restoreInput').click()">

      📤 Restore Progress

    </button>


    <input
      id="restoreInput"
      type="file"
      accept=".json"
      style="display:none"
      onchange="restoreBackup(event)"
    >

  </div>

</div>


<!-- =======================================================
     FOOTER
======================================================= -->

<div class="footer">

  <button
    id="saveBtn"
    class="btn"
    onclick="saveNow()">

    💾 Save

  </button>


  <button
    class="btn"
    onclick="resetAll()">

    Reset All

  </button>

</div>


<div class="copyright">
  ©turabi_alam
</div>


</div>


<!-- =======================================================
     MOBILE NAV
======================================================= -->

<nav class="mobile-nav">

  <button
    class="active"
    onclick="scrollToSection('dashboard')">

    <span>🏠</span>
    Home

  </button>


  <button
    onclick="scrollToSection('subjectsSection')">

    <span>📚</span>
    Subjects

  </button>


  <button
    onclick="scrollToSection('timerSection')">

    <span>⏱️</span>
    Timer

  </button>


  <button
    onclick="scrollToSection('backupSection')">

    <span>💾</span>
    Backup

  </button>

</nav>


<!-- =======================================================
     TOAST
======================================================= -->

<div
  id="toast"
  class="toast">
</div>

/* =========================================================
   KEY
========================================================= */

function key(book, chapter){

  return book + "__" + chapter;

}


/* =========================================================
   STATUS
========================================================= */

function getStatus(book, chapter){

  const value =
    saved[key(book, chapter)];


  if(value === "completed"){
    return "completed";
  }


  if(value === "in-progress"){
    return "in-progress";
  }


  /*
    Compatibility:
    old version used true / false
  */

  if(value === true){
    return "completed";
  }


  return "not-started";

}


/* =========================================================
   SET STATUS
========================================================= */

function setStatus(book, chapter){

  const current =
    getStatus(book, chapter);


  let next;


  if(current === "not-started"){

    next = "in-progress";

  }
  else if(current === "in-progress"){

    next = "completed";

  }
  else{

    next = "not-started";

  }


  saved[key(book, chapter)] =
    next;


  lastStudied = {

    book:book,
    chapter:chapter,
    time:Date.now()

  };


  localStorage.setItem(
    "syllabusTracker",
    JSON.stringify(saved)
  );


  localStorage.setItem(
    "lastStudied",
    JSON.stringify(lastStudied)
  );


  render();

}


/* =========================================================
   STATUS TEXT
========================================================= */

function statusText(status){

  if(status === "completed"){
    return "✓ Completed";
  }

  if(status === "in-progress"){
    return "◐ In Progress";
  }

  return "○ Start";

}


/* =========================================================
   SUBJECT CATEGORY
========================================================= */

function getCategory(book){

  if(book.startsWith("Physics")){
    return "Physics";
  }

  if(book.startsWith("Chemistry")){
    return "Chemistry";
  }

  if(book.startsWith("Higher Math")){
    return "Higher Math";
  }

  return "Biology";

}

   SAVE
========================================================= */

function saveNow(){

  localStorage.setItem(
    "syllabusTracker",

  localStorage.setItem(

  );


  const btn =
    document.getElementById("saveBtn");


  if(btn){

      btn.textContent;


    btn.textContent =
      "✅ Saved";


    setTimeout(
      () => {

        btn.textContent =
          oldText;

      },
      1200
    );

  }


  showToast("Progress saved successfully ✓");

}


/* =========================================================
   NOTES
========================================================= */

function saveNote(book, chapter){

  const input =
    document.getElementById(
      "note_" +
      encodeURIComponent(
        book + "__" + chapter
      )
    );


  if(!input){
    return;
  }


  const value =
    input.value.trim();


  const noteKey =
    key(book, chapter);


  if(value){

    notes[noteKey] =
      value;

  }
  else{

    delete notes[noteKey];

  }


  localStorage.setItem(
    "syllabusNotes",
    JSON.stringify(notes)
  );


  showToast("Note saved ✓");

}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){

  let total = 0;
  let completed = 0;
  let inProgress = 0;


  Object.entries(books).forEach(
    ([book,count]) => {

      total += count;


      for(
        let c = 1;
        c <= count;
        c++
      ){

        const status =
          getStatus(book,c);


        if(status === "completed"){
          completed++;
        }

        if(status === "in-progress"){
          inProgress++;
        }

      }

    }
  );


  const remaining =
    total - completed;


  const percent =
    total === 0
      ? 0
      : ((completed / total) * 100);


  const percentText =
    percent.toFixed(2);


  const dashboard =
    document.getElementById("dashboard");


  dashboard.innerHTML = `

    <div class="hero-card">

      <div class="hero-small">
        📊 Overall Progress
      </div>

      <div class="hero-number">
        ${percentText}%
      </div>

      <div class="hero-sub">
        ${completed} of ${total} chapters completed
      </div>

      <div class="hero-progress">

        <div
          class="hero-progress-bar"
          style="width:${percent}%"
        ></div>

      </div>

    </div>


    <div class="quick-stats">

      <div class="quick-stat">

        <div class="quick-label">
          📚 Total
        </div>

        <div class="quick-value">
          ${total}
        </div>

      </div>


      <div class="quick-stat">

        <div class="quick-label">
          ✅ Completed
        </div>

        <div class="quick-value">
          ${completed}
        </div>

      </div>


      <div class="quick-stat">

        <div class="quick-label">
          🟡 In Progress
        </div>

        <div class="quick-value">
          ${inProgress}
        </div>

      </div>


      <div class="quick-stat">

        <div class="quick-label">
          ⏳ Remaining
        </div>

        <div class="quick-value">
          ${remaining}
        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   CONTINUE STUDYING
========================================================= */

function renderContinue(){

  const container =
    document.getElementById(
      "continueCard"
    );


  if(!lastStudied){

    container.innerHTML = `

      <div class="continue-header">

        <div class="section-title">
          📖 Continue Studying
        </div>

      </div>

      <div class="continue-meta">
        Select a chapter to start tracking your study journey.
      </div>

    `;

    return;

  }


  const book =
    lastStudied.book;


  const chapter =
    lastStudied.chapter;


  const name =
    permanentChapterNames[book]?.[
      chapter - 1
    ] ||
    `Chapter ${chapter}`;


  const status =
    getStatus(book,chapter);


  const count =
    books[book];


  let completed = 0;


  for(
    let c = 1;
    c <= count;
    c++
  ){

    if(
      getStatus(book,c) === "completed"
    ){

      completed++;

    }

  }


  container.innerHTML = `

    <div class="continue-header">

      <div class="section-title">
        📖 Continue Studying
      </div>

      <button
        class="btn"
        onclick="jumpToLastChapter()">

        Open

      </button>

    </div>


    <div class="continue-book">
      ${book}
    </div>


    <div class="continue-chapter">
      ${name}
    </div>


    <div class="continue-meta">

      Chapter ${chapter} ·
      ${completed}/${count} completed ·
      ${statusText(status)}

    </div>

  `;

}


/* =========================================================
   RENDER SUBJECTS
========================================================= */

function render(){

  renderDashboard();

  renderContinue();


  const app =
    document.getElementById("app");


  app.innerHTML = "";


  const search =
    (
      document.getElementById(
        "searchInput"
      )?.value || ""
    )
    .trim()
    .toLowerCase();


  const subjectFilter =
    document.getElementById(
      "subjectFilter"
    )?.value || "all";


  const statusFilter =
    document.getElementById(
      "statusFilter"
    )?.value || "all";


  let visibleSubjects = 0;
  let visibleChapters = 0;


  Object.entries(books).forEach(
    ([book,count]) => {


      const category =
        getCategory(book);


      if(
        subjectFilter !== "all" &&
        category !== subjectFilter
      ){

        return;

      }


      const chapterMatches = [];


      for(
        let c = 1;
        c <= count;
        c++
      ){

        const name =
          permanentChapterNames[book]?.[
            c - 1
          ] ||
          `Chapter ${c}`;


        const status =
          getStatus(book,c);


        const searchMatch =
          !search ||
          name.toLowerCase().includes(search) ||
          book.toLowerCase().includes(search);


        const statusMatch =
          statusFilter === "all" ||
          status === statusFilter;


        if(
          searchMatch &&
          statusMatch
        ){

          chapterMatches.push({
            chapter:c,
            name:name,
            status:status
          });

        }

      }


      if(
        search ||
        statusFilter !== "all"
      ){

        if(chapterMatches.length === 0){
          return;
        }

      }


      visibleSubjects++;


      const card =
        document.createElement("div");


      card.className =
        "card subject-card";


      if(collapsedSubjects[book]){
        card.classList.add("collapsed");
      }


      /* =====================================================
         SUBJECT HEADER
      ===================================================== */

      const header =
        document.createElement("div");


      header.className =
        "subject-header";


      const left =
        document.createElement("div");


      left.className =
        "subject-left";


      const title =
        document.createElement("div");


      title.className =
        "book-title";


      title.textContent =
        book;


      const meta =
        document.createElement("div");


      meta.className =
        "subject-meta";


      let completed = 0;
      let inProgress = 0;


      for(
        let c = 1;
        c <= count;
        c++
      ){

        const s =
          getStatus(book,c);


        if(s === "completed"){
          completed++;
        }

        if(s === "in-progress"){
          inProgress++;
        }

      }


      const percent =
        count === 0
          ? 0
          : ((completed / count) * 100);


      meta.textContent =
        `${completed}/${count} completed · ${inProgress} in progress`;


      left.appendChild(title);

      left.appendChild(meta);


      const actions =
        document.createElement("div");


      actions.className =
        "subject-actions";


      const chevron =
        document.createElement("div");


      chevron.className =
        "chevron";


      chevron.textContent =
        "▼";


      actions.appendChild(chevron);


      header.appendChild(left);

      header.appendChild(actions);


      header.onclick =
        () => toggleSubject(book);


      card.appendChild(header);


      /* =====================================================
         SUBJECT PROGRESS
      ===================================================== */

      const subjectProgress =
        document.createElement("div");


      subjectProgress.className =
        "subject-progress";


      subjectProgress.innerHTML = `

        <div
          class="subject-progress-line">

          <div
            class="subject-progress-bar"
            style="width:${percent}%">
          </div>

        </div>

      `;


      card.appendChild(
        subjectProgress
      );


      /* =====================================================
         CHAPTER CONTAINER
      ===================================================== */

      const chapterContainer =
        document.createElement("div");


      chapterContainer.className =
        "chapter-container";


      const grid =
        document.createElement("div");


      grid.className =
        "grid";


      chapterMatches.forEach(
        item => {


          visibleChapters++;


          const c =
            item.chapter;


          const name =
            item.name;


          const status =
            item.status;


          const row =
            document.createElement("div");


          row.className =
            "chapter";


          if(status === "completed"){
            row.classList.add("done");
          }


          if(status === "in-progress"){
            row.classList.add("in-progress");
          }


          /* =================================================
             FIXED NAME
          ================================================= */

          const nameElement =
            document.createElement("div");


          nameElement.className =
            "chapterName";


          nameElement.textContent =
            name;


          /*
            IMPORTANT:
            এটি input নয়।
            তাই user chapter name edit করতে পারবে না।
          */


          row.appendChild(
            nameElement
          );


          /* =================================================
             STATUS BUTTON
          ================================================= */

          const statusButton =
            document.createElement("button");


          statusButton.className =
            "status-btn";


          if(status === "completed"){

            statusButton.classList.add(
              "status-completed"
            );

          }
          else if(status === "in-progress"){

            statusButton.classList.add(
              "status-progress"
            );

          }
          else{

            statusButton.classList.add(
              "status-not-started"
            );

          }


          statusButton.textContent =
            statusText(status);


          statusButton.onclick =
            () => {

              setStatus(book,c);

            };


          row.appendChild(
            statusButton
          );


          grid.appendChild(row);


          /* =================================================
             NOTES
          ================================================= */

          const note =
            notes[key(book,c)] || "";


          if(
            status === "in-progress" ||
            status === "completed"
          ){

            const noteBox =
              document.createElement("div");


            noteBox.className =
              "notes-box";


            noteBox.innerHTML = `

              <div class="notes-title">
                📝 Chapter Note
              </div>

              <textarea
                id="note_${encodeURIComponent(
                  book + "__" + c
                )}"
                class="notes-input"
                placeholder="Write a short note about this chapter..."
              >${escapeHTML(note)}</textarea>

              <button
                class="btn notes-save"
                onclick="saveNote(
                  '${escapeJS(book)}',
                  ${c}
                )">

                💾 Save Note

              </button>

            `;


            /*
              Note is intentionally shown
              only for active/completed chapters.
            */


            /*
              We don't append this inside the grid
              because that would break the chapter layout.
            */


            row.appendChild(
              noteBox
            );

          }

        }
      );


      chapterContainer.appendChild(grid);


      card.appendChild(
        chapterContainer
      );


      app.appendChild(card);

    }
  );


  if(visibleSubjects === 0){

    app.innerHTML = `

      <div class="card empty">

        <div class="empty-icon">
          🔎
        </div>

        <div>
          No chapter found.
        </div>

      </div>

    `;

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJS(value){

  return String(value)

    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}


/* =========================================================
   COLLAPSE SUBJECT
========================================================= */

function toggleSubject(book){

  collapsedSubjects[book] =
    !collapsedSubjects[book];


  localStorage.setItem(
    "collapsedSubjects",
    JSON.stringify(
      collapsedSubjects
    )
  );


  render();

}

function resetAll(){

  const ok =
    confirm(
      "Reset Progress?\n\n" +
      "This will remove all chapter progress.\n\n" +
      "Chapter names will NOT be changed."
    );


  if(!ok){

  localStorage.setItem(
    "syllabusTracker",

  );


  lastStudied =

  localStorage.removeItem(
    "lastStudied"
  );


  render();


  showToast(

  );

}

========================================================= */

function applyTheme(){

  const dark =
    localStorage.getItem(
      "syllabusTheme"
    ) === "dark";


  document.body.classList.toggle(
    "dark",
    dark
  );


  const btn =
    document.getElementById(
      "themeBtn"
    );


  if(btn){

    btn.textContent =
      dark
        ? "☀️ Light"
        : "🌙 Dark";

  }

}


function toggleDarkMode(){

  const dark =
    !document.body.classList.contains(
      "dark"
    );


  document.body.classList.toggle(
    "dark",
    dark
  );


  localStorage.setItem(
    "syllabusTheme",
    dark
      ? "dark"
      : "light"
  );


  applyTheme();

}


/* =========================================================
   BACKUP
========================================================= */

function downloadBackup(){

  const backup = {

    version:2,

    syllabusTracker:saved,

    syllabusNotes:notes,

    lastStudied:lastStudied,

    collapsedSubjects:collapsedSubjects,

    syllabusTheme:
      localStorage.getItem(
        "syllabusTheme"
      ) || "light",

    createdAt:
      new Date().toISOString()

  };


  const json =
    JSON.stringify(
      backup,
      null,
      2
    );


  const blob =
    new Blob(
      [json],
      {
        type:"application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href =
    url;


  a.download =
    "syllabus-tracker-backup.json";


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(url);


  showToast(
    "Backup downloaded ✓"
  );

}


/* =========================================================
   RESTORE BACKUP
========================================================= */

function restoreBackup(event){

  const file =
    event.target.files?.[0];


  if(!file){
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(){

      try{

        const data =
          JSON.parse(
            reader.result
          );


        if(
          !data ||
          typeof data !== "object"
        ){

          throw new Error(
            "Invalid backup"
          );

        }


        if(
          data.syllabusTracker &&
          typeof data.syllabusTracker === "object"
        ){

          saved =
            data.syllabusTracker;

        }


        if(
          data.syllabusNotes &&
          typeof data.syllabusNotes === "object"
        ){

          notes =
            data.syllabusNotes;

        }


        if(
          data.lastStudied
        ){

          lastStudied =
            data.lastStudied;

        }


        if(
          data.collapsedSubjects &&
          typeof data.collapsedSubjects === "object"
        ){

          collapsedSubjects =
            data.collapsedSubjects;

        }


        localStorage.setItem(
          "syllabusTracker",
          JSON.stringify(saved)
        );


        localStorage.setItem(
          "syllabusNotes",
          JSON.stringify(notes)
        );


        localStorage.setItem(
          "collapsedSubjects",
          JSON.stringify(collapsedSubjects)
        );


        if(lastStudied){

          localStorage.setItem(
            "lastStudied",
            JSON.stringify(lastStudied)
          );

        }


        if(data.syllabusTheme){

          localStorage.setItem(
            "syllabusTheme",
            data.syllabusTheme
          );

        }


        applyTheme();

        render();


        showToast(

        );


      }
      catch(error){

        alert(

        );

      }

    };


  reader.readAsText(file);


  event.target.value = "";

}


/* =========================================================
   TIMER
========================================================= */

let timerSeconds = 25 * 60;

let timerInterval = null;


function updateTimerDisplay(){

  const display =
    document.getElementById(
      "timerDisplay"
    );


  if(!display){
    return;
  }


  const minutes =
    Math.floor(
      timerSeconds / 60
    );


  const seconds =
    timerSeconds % 60;


  display.textContent =
    String(minutes).padStart(2,"0") +
    ":" +
    String(seconds).padStart(2,"0");

}


function startTimer(){

  if(timerInterval){
    return;
  }


  if(
    timerSeconds <= 0
  ){

    const input =
      document.getElementById(
        "timerMinutes"
      );


    const minutes =
      parseInt(
        input?.value || "25"
      );


    timerSeconds =
      minutes * 60;

  }


  timerInterval =
    setInterval(
      () => {

        if(timerSeconds <= 0){

          clearInterval(
            timerInterval
          );

          timerInterval =
            null;


          showToast(
            "⏰ Study session complete!"
          );


          return;

        }


        timerSeconds--;

        updateTimerDisplay();

      },
      1000
    );

}


function pauseTimer(){

  if(timerInterval){

    clearInterval(
      timerInterval
    );

    timerInterval =
      null;

  }

}


function resetTimer(){

  pauseTimer();


  const input =
    document.getElementById(
      "timerMinutes"
    );


  const minutes =
    parseInt(
      input?.value || "25"
    );


  timerSeconds =
    Math.max(
      1,
      Math.min(
        180,
        minutes
      )
    ) * 60;


  updateTimerDisplay();

}

function jumpToLastChapter(){

  if(!lastStudied){
    return;
  }


  const search =
    document.getElementById(
      "searchInput"
    );


  if(search){

    search.value = "";

  }


  const subjectFilter =
    document.getElementById(
      "subjectFilter"
    );


  if(subjectFilter){

    subjectFilter.value =
      "all";

  }


  const statusFilter =
    document.getElementById(
      "statusFilter"
    );


  if(statusFilter){

    statusFilter.value =
      "all";

  }


  render();


  setTimeout(
    () => {

      const cards =
        document.querySelectorAll(
          ".subject-card"
        );


      cards.forEach(card => {

        const title =
          card.querySelector(
            ".book-title"
          );


        if(
          title &&
          title.textContent ===
          lastStudied.book
        ){

          card.scrollIntoView({
            behavior:"smooth",
            block:"center"
          });

        }

      });

    },
    100
  );

}

function scrollToSection(id){

    });

  }

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  if(!toast){
    return;
  }


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      1800
    );

}
