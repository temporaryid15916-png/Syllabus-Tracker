<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />

  <title>Syllabus Tracker</title>

  <link rel="manifest" href="./manifest.webmanifest" />

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --card-soft: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --border: #e5e7eb;

      --primary: #2563eb;
      --primary-soft: #eff6ff;

      --success: #16a34a;
      --success-soft: #ecfdf3;

      --warning: #f59e0b;
      --warning-soft: #fffbeb;

      --danger: #dc2626;
      --danger-soft: #fef2f2;

      --shadow: 0 8px 30px rgba(15, 23, 42, 0.07);
      --radius: 18px;
    }

    body.dark {
      --bg: #0b1120;
      --card: #111827;
      --card-soft: #182233;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #263244;

      --primary: #60a5fa;
      --primary-soft: #172554;

      --success: #4ade80;
      --success-soft: #052e16;

      --warning: #fbbf24;
      --warning-soft: #422006;

      --danger: #f87171;
      --danger-soft: #450a0a;

      --shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        "Noto Sans Bengali",
        "Noto Sans",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);

      transition:
        background 0.25s ease,
        color 0.25s ease;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =====================================================
       HEADER
    ====================================================== */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;

      backdrop-filter: blur(14px);

      background: color-mix(
        in srgb,
        var(--bg) 88%,
        transparent
      );

      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1200px;
      margin: auto;

      padding: 16px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .brand h1 {
      margin: 0;

      font-size: 24px;
      line-height: 1.2;
      font-weight: 800;
    }

    .brand p {
      margin: 5px 0 0;

      color: var(--muted);
      font-size: 13px;
    }

    .theme-btn {
      border: 1px solid var(--border);

      background: var(--card);
      color: var(--text);

      padding: 9px 14px;

      border-radius: 12px;

      font-weight: 700;

      transition: 0.2s ease;
    }

    .theme-btn:hover {
      transform: translateY(-1px);
      border-color: var(--primary);
    }

    /* =====================================================
       MAIN
    ====================================================== */

    .container {
      max-width: 1200px;
      margin: auto;

      padding: 28px 20px 45px;
    }

    /* =====================================================
       DASHBOARD
    ====================================================== */

    .dashboard {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 14px;

      margin-bottom: 18px;
    }

    .stat-card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      padding: 18px;

      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);

      font-size: 13px;
      font-weight: 700;

      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 850;

      line-height: 1;
    }

    .stat-sub {
      margin-top: 7px;

      color: var(--muted);

      font-size: 12px;
    }

    /* =====================================================
       OVERALL PROGRESS
    ====================================================== */

    .overall-progress-card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      padding: 18px;

      box-shadow: var(--shadow);

      margin-bottom: 20px;
    }

    .overall-progress-top {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 10px;

      margin-bottom: 10px;
    }

    .overall-progress-top strong {
      font-size: 15px;
    }

    .overall-percent {
      font-weight: 850;
      color: var(--primary);
    }

    .progress-track {
      width: 100%;
      height: 10px;

      background: var(--border);

      border-radius: 999px;

      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #7c3aed
        );

      border-radius: inherit;

      transition:
        width 0.35s ease;
    }

    /* =====================================================
       CONTINUE CARD
    ====================================================== */

    .continue-card {
      background:
        linear-gradient(
          135deg,
          var(--primary-soft),
          var(--card)
        );

      border:
        1px solid
        color-mix(
          in srgb,
          var(--primary) 30%,
          var(--border)
        );

      border-radius: var(--radius);

      padding: 17px 18px;

      margin-bottom: 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .continue-info {
      min-width: 0;
    }

    .continue-label {
      color: var(--primary);

      font-size: 12px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 0.5px;

      margin-bottom: 4px;
    }

    .continue-title {
      font-weight: 800;
      font-size: 16px;
    }

    .continue-subtitle {
      color: var(--muted);
      font-size: 13px;

      margin-top: 3px;
    }

    .continue-btn {
      flex-shrink: 0;

      border: none;

      background: var(--primary);
      color: white;

      padding: 10px 15px;

      border-radius: 11px;

      font-weight: 800;
    }

    /* =====================================================
       TOOLBAR
    ====================================================== */

    .toolbar {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      padding: 15px;

      margin-bottom: 20px;

      box-shadow: var(--shadow);
    }

    .toolbar-main {
      display: grid;

      grid-template-columns:
        1fr 220px;

      gap: 10px;
    }

    .search-box,
    .subject-select {
      width: 100%;

      border: 1px solid var(--border);

      background: var(--card-soft);
      color: var(--text);

      border-radius: 12px;

      padding: 11px 13px;

      outline: none;

      transition: 0.2s ease;
    }

    .search-box:focus,
    .subject-select:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px
        color-mix(
          in srgb,
          var(--primary) 15%,
          transparent
        );
    }

    .filter-row {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 12px;

      align-items: center;
    }

    .filter-label {
      color: var(--muted);

      font-size: 12px;
      font-weight: 800;

      margin-right: 2px;
    }

    .filter-btn,
    .collapse-btn {
      border: 1px solid var(--border);

      background: var(--card-soft);
      color: var(--text);

      border-radius: 10px;

      padding: 8px 12px;

      font-size: 12px;
      font-weight: 800;

      transition: 0.2s ease;
    }

    .filter-btn:hover,
    .collapse-btn:hover {
      border-color: var(--primary);
    }

    .filter-btn.active {
      background: var(--primary);

      color: white;

      border-color: var(--primary);
    }

    .toolbar-spacer {
      flex: 1;
    }

    /* =====================================================
       SUBJECT CARDS
    ====================================================== */

    #subjectsContainer {
      display: flex;

      flex-direction: column;

      gap: 16px;
    }

    .subject-card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      box-shadow: var(--shadow);

      overflow: hidden;

      animation:
        fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .subject-header {
      padding: 17px 18px;

      display: flex;
      align-items: center;

      gap: 14px;

      border-bottom: 1px solid var(--border);

      cursor: pointer;

      user-select: none;
    }

    .subject-icon {
      width: 42px;
      height: 42px;

      border-radius: 13px;

      background: var(--primary-soft);
      color: var(--primary);

      display: grid;
      place-items: center;

      font-size: 19px;

      flex-shrink: 0;
    }

    .subject-info {
      min-width: 0;
      flex: 1;
    }

    .subject-title-row {
      display: flex;

      align-items: center;

      gap: 8px;

      flex-wrap: wrap;
    }

    .subject-title {
      margin: 0;

      font-size: 17px;
      font-weight: 850;
    }

    .subject-meta {
      color: var(--muted);

      font-size: 12px;

      margin-top: 4px;
    }

    .subject-progress-area {
      width: 180px;

      flex-shrink: 0;
    }

    .subject-progress-text {
      display: flex;

      justify-content: space-between;

      color: var(--muted);

      font-size: 11px;
      font-weight: 700;

      margin-bottom: 5px;
    }

    .subject-progress-track {
      height: 7px;

      background: var(--border);

      border-radius: 999px;

      overflow: hidden;
    }

    .subject-progress-fill {
      height: 100%;

      background: var(--success);

      border-radius: inherit;

      transition:
        width 0.3s ease;
    }

    .chevron {
      color: var(--muted);

      font-size: 18px;

      width: 25px;

      text-align: center;

      transition:
        transform 0.25s ease;
    }

    .subject-card.collapsed
    .chevron {
      transform: rotate(-90deg);
    }

    .subject-body {
      padding: 14px;
    }

    .subject-card.collapsed
    .subject-body {
      display: none;
    }

    /* =====================================================
       CHAPTER ROW
    ====================================================== */

    .chapter-list {
      display: grid;
      gap: 8px;
    }

    .chapter-row {
      display: flex;

      align-items: center;

      gap: 11px;

      padding: 11px 12px;

      border: 1px solid var(--border);

      background: var(--card-soft);

      border-radius: 13px;

      transition:
        border-color 0.2s ease,
        transform 0.2s ease,
        background 0.2s ease;
    }

    .chapter-row:hover {
      border-color:
        color-mix(
          in srgb,
          var(--primary) 45%,
          var(--border)
        );

      transform: translateY(-1px);
    }

    .chapter-row.not-started {
      background: var(--card-soft);
    }

    .chapter-row.in-progress {
      background: var(--warning-soft);

      border-color:
        color-mix(
          in srgb,
          var(--warning) 30%,
          var(--border)
        );
    }

    .chapter-row.completed {
      background: var(--success-soft);

      border-color:
        color-mix(
          in srgb,
          var(--success) 30%,
          var(--border)
        );
    }

    .chapter-number {
      width: 34px;
      height: 34px;

      border-radius: 10px;

      background: var(--border);

      color: var(--muted);

      display: grid;
      place-items: center;

      font-size: 11px;
      font-weight: 850;

      flex-shrink: 0;
    }

    .chapter-row.in-progress
    .chapter-number {
      background: var(--warning);
      color: white;
    }

    .chapter-row.completed
    .chapter-number {
      background: var(--success);
      color: white;
    }

    .chapter-content {
      min-width: 0;
      flex: 1;
    }

    .chapter-name {
      font-size: 14px;

      font-weight: 750;

      line-height: 1.45;
    }

    .chapter-status-text {
      margin-top: 3px;

      font-size: 11px;

      color: var(--muted);
    }

    .chapter-row.in-progress
    .chapter-status-text {
      color: var(--warning);

      font-weight: 750;
    }

    .chapter-row.completed
    .chapter-status-text {
      color: var(--success);

      font-weight: 750;
    }

    /* =====================================================
       STATUS BUTTON
    ====================================================== */

    .status-btn {
      border: 1px solid var(--border);

      background: var(--card);

      color: var(--text);

      border-radius: 10px;

      min-width: 125px;

      padding: 8px 10px;

      font-size: 12px;
      font-weight: 800;

      transition: 0.2s ease;

      flex-shrink: 0;
    }

    .status-btn.not-started:hover {
      border-color: var(--primary);

      color: var(--primary);

      background: var(--primary-soft);
    }

    .status-btn.in-progress {
      border-color: var(--warning);

      background: var(--warning-soft);

      color: var(--warning);
    }

    .status-btn.in-progress:hover {
      filter: brightness(0.96);
    }

    .status-btn.complete {
      background: var(--success);

      border-color: var(--success);

      color: white;
    }

    .status-btn.complete:hover {
      filter: brightness(0.95);
    }

    .chapter-row.last-selected {
      box-shadow:
        0 0 0 2px
        color-mix(
          in srgb,
          var(--primary) 20%,
          transparent
        );
    }

    /* =====================================================
       EMPTY
    ====================================================== */

    .empty-state {
      background: var(--card);

      border: 1px dashed var(--border);

      border-radius: var(--radius);

      padding: 45px 20px;

      text-align: center;

      color: var(--muted);
    }

    .empty-icon {
      font-size: 38px;

      margin-bottom: 8px;
    }

    .empty-state strong {
      display: block;

      color: var(--text);

      margin-bottom: 5px;
    }

    /* =====================================================
       BOTTOM ACTIONS
    ====================================================== */

    .bottom-actions {
      margin-top: 25px;

      padding: 16px;

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      box-shadow: var(--shadow);

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      flex-wrap: wrap;
    }

    /*
      ONLY ONE SAVE BUTTON
    */

    .save-btn {
      border: none;

      background: var(--success);

      color: white;

      padding: 11px 24px;

      border-radius: 11px;

      font-weight: 850;

      min-width: 125px;

      transition: 0.2s ease;
    }

    .save-btn:hover {
      transform: translateY(-1px);

      filter: brightness(0.96);
    }

    .reset-btn {
      border: 1px solid var(--border);

      background: var(--card-soft);

      color: var(--text);

      padding: 10px 16px;

      border-radius: 11px;

      font-weight: 800;

      transition: 0.2s ease;
    }

    .reset-btn:hover {
      border-color: var(--danger);

      color: var(--danger);

      background: var(--danger-soft);
    }

    /* =====================================================
       TOAST
    ====================================================== */

    #toastContainer {
      position: fixed;

      right: 18px;
      bottom: 18px;

      z-index: 500;

      display: flex;

      flex-direction: column;

      gap: 8px;

      pointer-events: none;
    }

    .toast {
      background: var(--text);

      color: var(--bg);

      padding: 11px 15px;

      border-radius: 11px;

      font-size: 13px;

      font-weight: 750;

      box-shadow: var(--shadow);

      animation:
        toastIn 0.25s ease;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =====================================================
       FOOTER
    ====================================================== */

    footer {
      text-align: center;

      color: var(--muted);

      font-size: 12px;

      padding: 20px;
    }

    /* =====================================================
       RESPONSIVE
    ====================================================== */

    @media (max-width: 900px) {

      .dashboard {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .subject-progress-area {
        width: 150px;
      }

    }

    @media (max-width: 700px) {

      .topbar-inner {
        padding: 13px 15px;
      }

      .brand h1 {
        font-size: 20px;
      }

      .container {
        padding:
          20px 14px 35px;
      }

      .toolbar-main {
        grid-template-columns: 1fr;
      }

      .subject-header {
        align-items: flex-start;
      }

      .subject-progress-area {
        display: none;
      }

      .subject-icon {
        width: 38px;
        height: 38px;
      }

      .chapter-row {
        align-items: flex-start;
      }

      .status-btn {
        min-width: 110px;
      }

    }

    @media (max-width: 520px) {

      .dashboard {
        gap: 9px;
      }

      .stat-card {
        padding: 14px;
      }

      .stat-value {
        font-size: 23px;
      }

      .continue-card {
        align-items: flex-start;

        flex-direction: column;
      }

      .continue-btn {
        width: 100%;
      }

      .chapter-row {
        padding: 10px;
      }

      .chapter-number {
        width: 30px;
        height: 30px;
      }

      .chapter-name {
        font-size: 13px;
      }

      .status-btn {
        min-width: 96px;

        padding: 7px 8px;

        font-size: 11px;
      }

      .bottom-actions {
        flex-direction: column;
      }

      .save-btn,
      .reset-btn {
        width: 100%;
      }

      #toastContainer {
        left: 14px;
        right: 14px;
        bottom: 14px;
      }

      .toast {
        text-align: center;
      }

    }
  </style>
</head>


<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="topbar">

    <div class="topbar-inner">

      <div class="brand">

        <h1>📚 Syllabus Tracker</h1>

        <p>
          Track your syllabus progress easily
        </p>

      </div>


      <button
        class="theme-btn"
        id="themeToggle"
        type="button"
      >
        🌙 Dark
      </button>

    </div>

  </header>


  <main class="container">

    <!-- ===================================================
         DASHBOARD
    ==================================================== -->

    <section class="dashboard">

      <div class="stat-card">

        <div class="stat-label">
          Total Chapters
        </div>

        <div
          class="stat-value"
          id="totalChapters"
        >
          0
        </div>

        <div class="stat-sub">
          Across all subjects
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Completed
        </div>

        <div
          class="stat-value"
          id="completedChapters"
        >
          0
        </div>

        <div class="stat-sub">
          Finished chapters
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          In Progress
        </div>

        <div
          class="stat-value"
          id="inProgressChapters"
        >
          0
        </div>

        <div class="stat-sub">
          Currently studying
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Overall Progress
        </div>

        <div
          class="stat-value"
          id="overallPercent"
        >
          0%
        </div>

        <div class="stat-sub">
          Your syllabus completion
        </div>

      </div>

    </section>


    <!-- ===================================================
         OVERALL PROGRESS
    ==================================================== -->

    <section class="overall-progress-card">

      <div class="overall-progress-top">

        <strong>
          Overall Syllabus Progress
        </strong>

        <span
          class="overall-percent"
          id="overallPercentTop"
        >
          0%
        </span>

      </div>


      <div class="progress-track">

        <div
          class="progress-fill"
          id="overallProgressFill"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         CONTINUE
    ==================================================== -->

    <section
      class="continue-card"
      id="continueCard"
      style="display:none;"
    >

      <div class="continue-info">

        <div class="continue-label">
          Continue Studying
        </div>

        <div
          class="continue-title"
          id="continueTitle"
        ></div>

        <div
          class="continue-subtitle"
          id="continueSubtitle"
        ></div>

      </div>


      <button
        class="continue-btn"
        id="continueBtn"
        type="button"
      >
        Continue →
      </button>

    </section>


    <!-- ===================================================
         SEARCH / FILTER
    ==================================================== -->

    <section class="toolbar">

      <div class="toolbar-main">

        <input
          type="search"
          id="chapterSearch"
          class="search-box"
          placeholder="🔎 Search chapter or subject..."
          autocomplete="off"
          aria-label="Search chapters"
        />


        <select
          id="subjectFilter"
          class="subject-select"
          aria-label="Filter by subject"
        >

          <option value="all">
            📚 All Subjects
          </option>

        </select>

      </div>


      <div class="filter-row">

        <span class="filter-label">
          Status:
        </span>


        <button
          class="filter-btn active"
          data-status="all"
          type="button"
        >
          All
        </button>


        <button
          class="filter-btn"
          data-status="not-started"
          type="button"
        >
          ⚪ Not Started
        </button>


        <button
          class="filter-btn"
          data-status="in-progress"
          type="button"
        >
          🟡 In Progress
        </button>


        <button
          class="filter-btn"
          data-status="completed"
          type="button"
        >
          🟢 Complete
        </button>


        <div class="toolbar-spacer"></div>


        <button
          class="collapse-btn"
          id="expandAllBtn"
          type="button"
        >
          Expand All
        </button>


        <button
          class="collapse-btn"
          id="collapseAllBtn"
          type="button"
        >
          Collapse All
        </button>

      </div>

    </section>


    <!-- ===================================================
         SUBJECTS
    ==================================================== -->

    <section id="subjectsContainer"></section>


    <!-- ===================================================
         BOTTOM ACTIONS
         ONLY ONE SAVE BUTTON
    ==================================================== -->

    <section class="bottom-actions">

      <button
        class="save-btn"
        id="saveBtn"
        type="button"
      >
        💾 Save
      </button>


      <button

    /* =====================================================
       STORAGE
    ====================================================== */

    const STORAGE_KEY =
      "syllabusTracker";

    const THEME_KEY =
      "syllabusTheme";

    const LAST_KEY =
      "syllabusLastChapter";

    const COLLAPSE_KEY =
      "syllabusCollapsed";


    function readJSON(
      key,
      fallback
    ) {

      try {

        const value =
          localStorage.getItem(key);

        if (!value) {
          return fallback;
        }

        return JSON.parse(value);

      } catch (error) {

        return fallback;

      }

    }


    function writeJSON(
      key,
      value
    ) {

      try {

        localStorage.setItem(
          key,
          JSON.stringify(value)
        );

        return true;

      } catch (error) {

        return false;

      }

    }


    function removeStorage(key) {

      try {

        localStorage.removeItem(key);

      } catch (error) {}

    }


    /* =====================================================
       LOAD PROGRESS
    ====================================================== */

    const rawProgress =
      readJSON(
        STORAGE_KEY,
        {}
      );


    const progress = {};


    const validProgressKeys =
      new Set();


    Object.entries(books)
      .forEach(
        ([book, count]) => {

          for (
            let chapter = 1;
            chapter <= count;
            chapter++
          ) {

            validProgressKeys.add(
              `${book}__${chapter}`
            );

          }

        }
      );


    /*
      New format:
        not-started
        in-progress
        complete

      Old format:
        true = complete
    */

    Object.entries(
      rawProgress || {}
    ).forEach(
      ([key, value]) => {

        if (
          !validProgressKeys.has(key)
        ) {
          return;
        }


        if (
          value === "in-progress" ||
          value === "complete"
        ) {

          progress[key] =
            value;

        }


        /*
          Old saved data compatibility
        */

        else if (
          value === true
        ) {

          progress[key] =
            "complete";

        }

      }
    );


    let lastChapter =
      readJSON(
        LAST_KEY,
        null
      );


    let collapsedSubjects =
      readJSON(
        COLLAPSE_KEY,
        {}
      );


    /* =====================================================
       FILTER STATE
    ====================================================== */

    const state = {

      search: "",

      subject: "all",

      status: "all"

    };


    /* =====================================================
       STATUS
    ====================================================== */

    function progressKey(
      book,
      chapter
    ) {

      return `${book}__${chapter}`;

    }


    function getStatus(
      book,
      chapter
    ) {

      return (
        progress[
          progressKey(
            book,
            chapter
          )
        ] || "not-started"
      );

    }


    function setStatus(
      book,
      chapter,
      status
    ) {

      const key =
        progressKey(
          book,
          chapter
        );


      /*
        Not Started is the default,
        so don't needlessly store it.
      */

      if (
        status === "not-started"
      ) {

        delete progress[key];

      } else {

        progress[key] =
          status;

      }

    }


    /* =====================================================
       COUNTERS
    ====================================================== */

    function getBookCompleted(book) {

      let count = 0;


      for (
        let chapter = 1;
        chapter <= books[book];
        chapter++
      ) {

        if (
          getStatus(
            book,
            chapter
          ) === "complete"
        ) {

          count++;

        }

      }


      return count;

    }


    function getBookInProgress(book) {

      let count = 0;


      for (
        let chapter = 1;
        chapter <= books[book];
        chapter++
      ) {

        if (
          getStatus(
            book,
            chapter
          ) === "in-progress"
        ) {

          count++;

        }

      }


      return count;

    }


    function getBookPercent(book) {

      const total =
        books[book];


      const completed =
        getBookCompleted(book);


      return total
        ? Math.round(
            (completed / total) * 100
          )
        : 0;

    }


    function getTotalChapters() {

      return Object.values(books)
        .reduce(
          (sum, count) =>
            sum + count,
          0
        );

    }


    function getTotalCompleted() {

      let total = 0;


      Object.keys(books)
        .forEach(book => {

          total +=
            getBookCompleted(book);

        });


      return total;

    }


    function getTotalInProgress() {

      let total = 0;


      Object.keys(books)
        .forEach(book => {

          total +=
            getBookInProgress(book);

        });


      return total;

    }


    /* =====================================================
       TOAST
    ====================================================== */

    function showToast(message) {

      const container =
        document.getElementById(
          "toastContainer"
        );


      const toast =
        document.createElement(
          "div"
        );


      toast.className =
        "toast";


      toast.textContent =
        message;


      container.appendChild(
        toast
      );


      setTimeout(
        () => {

          toast.style.opacity =
            "0";

          toast.style.transform =
            "translateY(8px)";


          setTimeout(
            () => {

              toast.remove();

            },
            200
          );

        },
        1800
      );

    }


    /* =====================================================
       SAVE
    ====================================================== */

    function saveProgress(
      showMessage = true
    ) {

      const success =
        writeJSON(
          STORAGE_KEY,
          progress
        );


      if (
        success &&
        showMessage
      ) {

        showToast(
          "✅ Saved successfully"
        );

      }


      return success;

    }


    /* =====================================================
       LAST CHAPTER
    ====================================================== */

    function rememberChapter(
      book,
      chapter
    ) {

      lastChapter = {

        book,

        chapter,

        time:
          Date.now()

      };


      writeJSON(
        LAST_KEY,
        lastChapter
      );

    }


    /* =====================================================
       THEME
    ====================================================== */

    function applyTheme(theme) {

      document.body.classList.toggle(
        "dark",
        theme === "dark"
      );


      const button =
        document.getElementById(
          "themeToggle"
        );


      button.textContent =
        theme === "dark"
          ? "☀️ Light"
          : "🌙 Dark";


      try {

        localStorage.setItem(
          THEME_KEY,
          theme
        );

      } catch (error) {}

    }


    function loadTheme() {

      let theme = "light";


      try {

        theme =
          localStorage.getItem(
            THEME_KEY
          ) || "light";

      } catch (error) {}


      applyTheme(theme);

    }


    /* =====================================================
       FILTER
    ====================================================== */

    function chapterMatches(
      book,
      chapter
    ) {

      const name =
        permanentChapterNames[
          book
        ]?.[chapter - 1]
        || `Chapter ${chapter}`;


      const search =
        state.search
          .trim()
          .toLowerCase();


      const matchesSearch =
        !search ||
        book
          .toLowerCase()
          .includes(search) ||
        name
          .toLowerCase()
          .includes(search);


      if (!matchesSearch) {
        return false;
      }


      const status =
        getStatus(
          book,
          chapter
        );


      if (
        state.status !== "all" &&
        status !== state.status
      ) {

        return false;

      }


      return true;

    }


    function bookMatches(book) {

      if (
        state.subject !== "all" &&
        state.subject !== book
      ) {

        return false;

      }


      for (
        let chapter = 1;
        chapter <= books[book];
        chapter++
      ) {

        if (
          chapterMatches(
            book,
            chapter
          )
        ) {

          return true;

        }

      }


      return false;

    }


    /* =====================================================
       DASHBOARD
    ====================================================== */

    function updateDashboard() {

      const total =
        getTotalChapters();


      const completed =
        getTotalCompleted();


      const inProgress =
        getTotalInProgress();


      const percent =
        total
          ? Math.round(
              (completed / total) * 100
            )
          : 0;


      document.getElementById(
        "totalChapters"
      ).textContent =
        total;


      document.getElementById(
        "completedChapters"
      ).textContent =
        completed;


      document.getElementById(
        "inProgressChapters"
      ).textContent =
        inProgress;


      document.getElementById(
        "overallPercent"
      ).textContent =
        `${percent}%`;


      document.getElementById(
        "overallPercentTop"
      ).textContent =
        `${percent}%`;


      document.getElementById(
        "overallProgressFill"
      ).style.width =
        `${percent}%`;

    }


    /* =====================================================
       SUBJECT FILTER
    ====================================================== */

    function buildSubjectFilter() {

      const select =
        document.getElementById(
          "subjectFilter"
        );


      select.innerHTML =
        "";


      const allOption =
        document.createElement(
          "option"
        );


      allOption.value =
        "all";


      allOption.textContent =
        "📚 All Subjects";


      select.appendChild(
        allOption
      );


      Object.keys(books)
        .forEach(book => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            book;


          option.textContent =
            book;


          select.appendChild(
            option
          );

        });


      select.value =
        state.subject;

    }


    /* =====================================================
       CONTINUE CARD
    ====================================================== */

    function updateContinueCard() {

      const card =
        document.getElementById(
          "continueCard"
        );


      if (
        !lastChapter ||
        !books[lastChapter.book] ||
        lastChapter.chapter < 1 ||
        lastChapter.chapter >
          books[lastChapter.book]
      ) {

        card.style.display =
          "none";

        return;

      }


      const book =
        lastChapter.book;


      const chapter =
        lastChapter.chapter;


      const name =
        permanentChapterNames[
          book
        ]?.[chapter - 1]
        || `Chapter ${chapter}`;


      document.getElementById(
        "continueTitle"
      ).textContent =
        name;


      document.getElementById(
        "continueSubtitle"
      ).textContent =
        `${book} • Chapter ${chapter}`;


      card.style.display =
        "flex";

    }


    /* =====================================================
       STATUS FLOW
    ====================================================== */

    function handleStatusClick(
      book,
      chapter
    ) {

      const current =
        getStatus(
          book,
          chapter
        );


      /*
        NOT STARTED
        ↓
        IN PROGRESS
      */

      if (
        current === "not-started"
      ) {

        setStatus(
          book,
          chapter,
          "in-progress"
        );


        rememberChapter(
          book,
          chapter
        );


        saveProgress(false);

        render();


        showToast(
          "🟡 In Progress"
        );


        return;

      }


      /*
        IN PROGRESS
        ↓
        COMPLETE
      */

      if (
        current === "in-progress"
      ) {

        setStatus(
          book,
          chapter,
          "complete"
        );


        rememberChapter(
          book,
          chapter
        );


        saveProgress(false);

        render();


        showToast(
          "🟢 Complete!"
        );


        return;

      }


      /*
        COMPLETE
        ↓
        NOT STARTED

        NO CONFIRMATION
      */

      if (
        current === "complete"
      ) {

        setStatus(
          book,
          chapter,
          "not-started"
        );


        rememberChapter(
          book,
          chapter
        );


        saveProgress(false);

        render();


        showToast(
          "⚪ Not Started"
        );

      }

    }


    /* =====================================================
       SUBJECT CARD
    ====================================================== */

    function createSubjectCard(
      book,
      bookIndex
    ) {

      const completed =
        getBookCompleted(book);


      const inProgress =
        getBookInProgress(book);


      const total =
        books[book];


      const percent =
        getBookPercent(book);


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "subject-card";


      const isSearching =
        state.search.trim() !== "" ||
        state.status !== "all" ||
        state.subject !== "all";


      const isCollapsed =
        !isSearching &&
        collapsedSubjects[book] === true;


      if (isCollapsed) {

        card.classList.add(
          "collapsed"
        );

      }


      card.id =
        `subject-${bookIndex}`;


      /* ---------- HEADER ---------- */

      const header =
        document.createElement(
          "div"
        );


      header.className =
        "subject-header";


      header.setAttribute(
        "role",
        "button"
      );


      header.setAttribute(
        "tabindex",
        "0"
      );


      const icon =
        document.createElement(
          "div"
        );


      icon.className =
        "subject-icon";


      const icons = [
        "⚛️",
        "🔬",
        "🧪",
        "🧫",
        "📐",
        "📊",
        "🌱",
        "🦎"
      ];


      icon.textContent =
        icons[
          bookIndex % icons.length
        ];


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "subject-info";


      const titleRow =
        document.createElement(
          "div"
        );


      titleRow.className =
        "subject-title-row";


      const title =
        document.createElement(
          "h2"
        );


      title.className =
        "subject-title";


      title.textContent =
        book;


      titleRow.appendChild(
        title
      );


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "subject-meta";


      meta.textContent =
        `${completed} complete • ${inProgress} in progress • ${total} total`;


      info.appendChild(
        titleRow
      );


      info.appendChild(
        meta
      );


      const progressArea =
        document.createElement(
          "div"
        );


      progressArea.className =
        "subject-progress-area";


      const progressText =
        document.createElement(
          "div"
        );


      progressText.className =
        "subject-progress-text";


      const progressLeft =
        document.createElement(
          "span"
        );


      progressLeft.textContent =
        `${completed}/${total}`;


      const progressRight =
        document.createElement(
          "span"
        );


      progressRight.textContent =
        `${percent}%`;


      progressText.appendChild(
        progressLeft
      );


      progressText.appendChild(
        progressRight
      );


      const progressTrack =
        document.createElement(
          "div"
        );


      progressTrack.className =
        "subject-progress-track";


      const progressFill =
        document.createElement(
          "div"
        );


      progressFill.className =
        "subject-progress-fill";


      progressFill.style.width =
        `${percent}%`;


      progressTrack.appendChild(
        progressFill
      );


      progressArea.appendChild(
        progressText
      );


      progressArea.appendChild(
        progressTrack
      );


      const chevron =
        document.createElement(
          "div"
        );


      chevron.className =
        "chevron";


      chevron.textContent =
        "⌄";


      header.appendChild(
        icon
      );


      header.appendChild(
        info
      );


      header.appendChild(
        progressArea
      );


      header.appendChild(
        chevron
      );


      function toggleSubject() {

        const collapsed =
          card.classList.toggle(
            "collapsed"
          );


        collapsedSubjects[book] =
          collapsed;


        writeJSON(
          COLLAPSE_KEY,
          collapsedSubjects
        );

      }


      header.addEventListener(
        "click",
        toggleSubject
      );


      header.addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter" ||
            event.key === " "
          ) {

            event.preventDefault();

            toggleSubject();

          }

        }
      );


      /* ---------- BODY ---------- */

      const body =
        document.createElement(
          "div"
        );


      body.className =
        "subject-body";


      const chapterList =
        document.createElement(
          "div"
        );


      chapterList.className =
        "chapter-list";


      for (
        let chapter = 1;
        chapter <= total;
        chapter++
      ) {

        if (
          !chapterMatches(
            book,
            chapter
          )
        ) {

          continue;

        }


        const status =
          getStatus(
            book,
            chapter
          );


        const row =
          document.createElement(
            "div"
          );


        row.className =
          "chapter-row";


        if (
          status === "not-started"
        ) {

          row.classList.add(
            "not-started"
          );

        }


        if (
          status === "in-progress"
        ) {

          row.classList.add(
            "in-progress"
          );

        }


        if (
          status === "complete"
        ) {

          row.classList.add(
            "completed"
          );

        }


        if (
          lastChapter &&
          lastChapter.book === book &&
          lastChapter.chapter === chapter
        ) {

          row.classList.add(
            "last-selected"
          );

        }


        row.id =
          `chapter-${bookIndex}-${chapter}`;


        /* ---------- NUMBER ---------- */

        const number =
          document.createElement(
            "div"
          );


        number.className =
          "chapter-number";


        number.textContent =
          String(
            chapter
          ).padStart(
            2,
            "0"
          );


        /* ---------- CONTENT ---------- */

        const content =
          document.createElement(
            "div"
          );


        content.className =
          "chapter-content";


        const name =
          document.createElement(
            "div"
          );


        name.className =
          "chapter-name";


        /*
          FIXED CHAPTER NAME.
          NO INPUT.
          NO EDITING.
        */

        name.textContent =
          permanentChapterNames[
            book
          ]?.[chapter - 1]
          || `Chapter ${chapter}`;


        const statusText =
          document.createElement(
            "div"
          );


        statusText.className =
          "chapter-status-text";


        if (
          status === "not-started"
        ) {

          statusText.textContent =
            "Not Started";

        }


        if (
          status === "in-progress"
        ) {

          statusText.textContent =
            "In Progress";

        }


        if (
          status === "complete"
        ) {

          statusText.textContent =
            "✓ Complete";

        }


        content.appendChild(
          name
        );


        content.appendChild(
          statusText
        );


        /* ---------- BUTTON ---------- */

        const statusBtn =
          document.createElement(
            "button"
          );


        statusBtn.type =
          "button";


        statusBtn.className =
          "status-btn";


        if (
          status === "not-started"
        ) {

          statusBtn.classList.add(
            "not-started"
          );


          statusBtn.textContent =
            "⚪ Not Started";

        }


        if (
          status === "in-progress"
        ) {

          statusBtn.classList.add(
            "in-progress"
          );


          statusBtn.textContent =
            "🟡 In Progress";

        }


        if (
          status === "complete"
        ) {

          statusBtn.classList.add(
            "complete"
          );


          statusBtn.textContent =
            "✓ Complete";

        }


        statusBtn.addEventListener(
          "click",
          event => {

            event.stopPropagation();


            handleStatusClick(
              book,
              chapter
            );

          }
        );


        row.appendChild(
          number
        );


        row.appendChild(
          content
        );


        row.appendChild(
          statusBtn
        );


        chapterList.appendChild(
          row
        );

      }


      body.appendChild(
        chapterList
      );


      card.appendChild(
        header
      );


      card.appendChild(
        body
      );


      return card;

    }


    /* =====================================================
       RENDER
    ====================================================== */

    function render() {

      updateDashboard();

      buildSubjectFilter();

      updateContinueCard();


      const container =
        document.getElementById(
          "subjectsContainer"
        );


      container.innerHTML =
        "";


      let visibleBooks = 0;


      Object.keys(books)
        .forEach(
          (book, index) => {

            if (
              !bookMatches(book)
            ) {

              return;

            }


            const card =
              createSubjectCard(
                book,
                index
              );


            container.appendChild(
              card
            );


            visibleBooks++;

          }
        );


      if (
        visibleBooks === 0
      ) {

        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "empty-state";


        const icon =
          document.createElement(
            "div"
          );


        icon.className =
          "empty-icon";


        icon.textContent =
          "🔎";


        const strong =
          document.createElement(
            "strong"
          );


        strong.textContent =
          "No chapters found";


        const text =
          document.createElement(
            "span"
          );


        text.textContent =
          "Try another search or filter.";


        empty.appendChild(
          icon
        );


        empty.appendChild(
          strong
        );


        empty.appendChild(
          text
        );


        container.appendChild(
          empty
        );

      }


      updateFilterButtons();

    }


    /* =====================================================
       FILTER BUTTONS
    ====================================================== */

    function updateFilterButtons() {

      document
        .querySelectorAll(
          ".filter-btn"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.status ===
                state.status
            );

          }
        );

    }


    /* =====================================================
       EXPAND / COLLAPSE
    ====================================================== */

    function expandAll() {

      Object.keys(books)
        .forEach(
          book => {

            collapsedSubjects[
              book
            ] = false;

          }
        );


      writeJSON(
        COLLAPSE_KEY,
        collapsedSubjects
      );


      render();


      showToast(
        "📖 All subjects expanded"
      );

    }


    function collapseAll() {

      Object.keys(books)
        .forEach(
          book => {

            collapsedSubjects[
              book
            ] = true;

          }
        );


      writeJSON(
        COLLAPSE_KEY,
        collapsedSubjects
      );


      render();


      showToast(
        "📕 All subjects collapsed"
      );

    }


    /* =====================================================
       RESET ALL
    ====================================================== */

    function resetAll() {

      const confirmed =
        confirm(
          "সব chapter-এর progress reset হবে।\n\n" +
          "সবগুলো chapter আবার Not Started হবে।\n\n" +
          "Chapter names পরিবর্তন হবে না।\n\n" +
          "আপনি কি নিশ্চিত?"
        );


      if (!confirmed) {
        return;
      }


      Object.keys(
        progress
      ).forEach(
        key => {

          delete progress[key];

        }
      );


      lastChapter =
        null;


      removeStorage(
        LAST_KEY
      );


      saveProgress(
        false
      );


      render();


      showToast(
        "🗑️ All chapters are now Not Started"
      );

    }


    /* =====================================================
       EVENT LISTENERS
    ====================================================== */

    document
      .getElementById(
        "themeToggle"
      )
      .addEventListener(
        "click",
        () => {

          const isDark =
            document.body
              .classList
              .contains(
                "dark"
              );


          applyTheme(
            isDark
              ? "light"
              : "dark"
          );

        }
      );


    document
      .getElementById(
        "chapterSearch"
      )
      .addEventListener(
        "input",
        event => {

          state.search =
            event.target.value;


          render();


          const search =
            document.getElementById(
              "chapterSearch"
            );


          search.focus();


          search.setSelectionRange(
            state.search.length,
            state.search.length
          );

        }
      );


    document
      .getElementById(
        "subjectFilter"
      )
      .addEventListener(
        "change",
        event => {

          state.subject =
            event.target.value;


          render();


          if (
            state.subject !==
            "all"
          ) {

            const index =
              Object.keys(
                books
              ).indexOf(
                state.subject
              );


            if (
              index >= 0
            ) {

              requestAnimationFrame(
                () => {

                  document
                    .getElementById(
                      `subject-${index}`
                    )
                    ?.scrollIntoView({
                      behavior:
                        "smooth",

                      block:
                        "start"
                    });

                }
              );

            }

          }

        }
      );


    document
      .querySelectorAll(
        ".filter-btn"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              state.status =
                button.dataset.status;


              render();

            }
          );

        }
      );


    document
      .getElementById(
        "expandAllBtn"
      )
      .addEventListener(
        "click",
        expandAll
      );


    document
      .getElementById(
        "collapseAllBtn"
      )
      .addEventListener(
        "click",
        collapseAll
      );


    /* =====================================================
       SAVE BUTTON
       ONLY ONE SAVE BUTTON IN THE APP
    ====================================================== */

    document
      .getElementById(
        "saveBtn"
      )
      .addEventListener(
        "click",
        () => {

          if (
            saveProgress(true)
          ) {

            const button =
              document.getElementById(
                "saveBtn"
              );


            const oldText =
              button.textContent;


            button.textContent =
              "✅ Saved";


            setTimeout(
              () => {

                button.textContent =
                  oldText;

              },
              1600
            );

          }

        }
      );


    /* =====================================================
       RESET BUTTON
    ====================================================== */

    document
      .getElementById(
        "resetBtn"
      )
      .addEventListener(
        "click",
        resetAll
      );


    /* =====================================================
       CONTINUE BUTTON
    ====================================================== */

    document
      .getElementById(
        "continueBtn"
      )
      .addEventListener(
        "click",
        () => {

          if (!lastChapter) {
            return;
          }


          const index =
            Object.keys(
              books
            ).indexOf(
              lastChapter.book
            );


          if (
            index < 0
          ) {

            return;

          }


          state.search =
            "";

          state.subject =
            "all";

          state.status =
            "all";


          render();


          requestAnimationFrame(
            () => {

              const target =
                document.getElementById(
                  `chapter-${index}-${lastChapter.chapter}`
                );


              if (target) {

                target.scrollIntoView({
                  behavior:
                    "smooth",

                  block:
                    "center"
                });


                target.animate(
                  [
                    {
                      transform:
                        "scale(1)"
                    },

                    {
                      transform:
                        "scale(1.02)"
                    },

                    {
                      transform:
                        "scale(1)"
                    }

                  ],
                  {
                    duration:
                      450
                  }
                );

              }

            }
          );

        }
      );


    /* =====================================================
       SAFETY AUTO-SAVE
    ====================================================== */

    window.addEventListener(
      "beforeunload",
      () => {

        /*
          This is only a safety net.
          The visible Save button remains
          the main manual save control.
        */

        saveProgress(false);

      }
    );


    /* =====================================================
       START APP
    ====================================================== */

    loadTheme();

    render();

  </script>


  <!-- =====================================================
       SERVICE WORKER
  ====================================================== -->

  <script>

    if (
      "serviceWorker" in
      navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("./sw.js")
            .catch(
              () => {}
            );

        }
      );

    }

  </script>

</body>
